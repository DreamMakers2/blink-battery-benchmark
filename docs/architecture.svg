<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Blink Battery Experiment Dashboard architecture</title>
  <desc id="desc">Horizontal architecture diagram showing browser, local dashboard, experiment runner, loopback Blink adapter, Blink service and doorbell, plus SQLite, FFmpeg HLS, and DPAPI authentication storage.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 38px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}.group{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155;letter-spacing:.06em}.cardTitle{font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.cardText{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}.label{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}.small{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4;rx:22;filter:url(#shadow)}.local{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 8;rx:30}.external{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5;rx:22;filter:url(#shadow)}.store{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;rx:18}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.line2{stroke:#2563eb;stroke-width:2.8;fill:none;marker-end:url(#arrowBlue)}.bi{stroke:#475569;stroke-width:2.5;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.iconStroke{stroke:#2563eb;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.iconFill{fill:#dbeafe}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f1f5f9"/>
  <text x="80" y="76" class="title">Blink Battery Experiment Dashboard</text><text x="80" y="108" class="subtitle">Local-first experiment control, persistence, and media flow</text>
  <rect x="60" y="145" width="1240" height="675" class="local"/><text x="88" y="178" class="group">WINDOWS HOST · LOCAL SECURITY BOUNDARY</text>
  <rect x="95" y="245" width="220" height="170" class="card"/><circle cx="138" cy="290" r="24" class="iconFill"/><rect x="124" y="277" width="29" height="23" rx="3" class="iconStroke"/><path d="M128 284h21M134 306h10" class="iconStroke"/><text x="115" y="340" class="cardTitle">Browser UI</text><text x="115" y="370" class="cardText">Status · history · controls</text><text x="115" y="394" class="small">Static assets served locally</text>
  <rect x="385" y="225" width="245" height="210" class="card"/><circle cx="430" cy="273" r="24" class="iconFill"/><path d="M416 285v-20h28v20M421 265v-8h18v8M422 275h4M434 275h4" class="iconStroke"/><text x="405" y="326" class="cardTitle">aiohttp Dashboard</text><text x="405" y="356" class="cardText">HTTP interface + browser auth</text><text x="405" y="382" class="small">Default: 127.0.0.1:8090</text><text x="405" y="405" class="small">LAN mode is explicit opt-in</text>
  <rect x="700" y="225" width="250" height="210" class="card"/><circle cx="745" cy="273" r="24" class="iconFill"/><path d="M733 273h24M745 261v24M735 285l20-24" class="iconStroke"/><text x="720" y="326" class="cardTitle">Experiment Runner</text><text x="720" y="356" class="cardText">Scheduling + durable state</text><text x="720" y="382" class="small">Snapshots · stream · recovery</text><text x="720" y="405" class="small">Low-battery / outage logic</text>
  <rect x="1020" y="225" width="240" height="210" class="card"/><circle cx="1065" cy="273" r="24" class="iconFill"/><path d="M1053 264h24v18h-24zM1047 273h6M1077 273h6M1060 258v6M1070 258v6" class="iconStroke"/><text x="1040" y="326" class="cardTitle">Blink Adapter</text><text x="1040" y="356" class="cardText">Blinkpy + managed live view</text><text x="1040" y="382" class="small">HTTP 127.0.0.1:8080</text><text x="1040" y="405" class="small">TCP 127.0.0.1:5000</text>
  <rect x="1360" y="245" width="190" height="170" class="external"/><circle cx="1402" cy="290" r="24" class="iconFill"/><path d="M1392 301v-21l10-7 10 7v21M1397 286h10M1397 292h10" class="iconStroke"/><text x="1380" y="340" class="cardTitle">Blink service</text><text x="1380" y="370" class="cardText">Selected doorbell</text><text x="1380" y="394" class="small">External dependency</text>
  <path d="M315 330 H385" class="bi"/><text x="327" y="315" class="label">HTTP</text><path d="M630 330 H700" class="line"/><text x="641" y="315" class="label">async calls</text><path d="M950 305 H1020" class="line"/><text x="957" y="286" class="label">battery / snapshot</text><path d="M1260 330 H1360" class="bi"/><text x="1280" y="313" class="label">Blink API / live view</text>
  <rect x="690" y="560" width="270" height="145" class="store"/><circle cx="733" cy="606" r="22" class="iconFill"/><ellipse cx="733" cy="595" rx="13" ry="6" class="iconStroke"/><path d="M720 595v20c0 3 6 6 13 6s13-3 13-6v-20M720 605c0 3 6 6 13 6s13-3 13-6" class="iconStroke"/><text x="770" y="604" class="cardTitle">SQLite</text><text x="713" y="649" class="cardText">runs · phases · measurements · events</text><text x="713" y="675" class="small">runtime/data/experiment.db · WAL</text><path d="M825 435 V560" class="line"/><text x="840" y="510" class="label">checkpoint</text>
  <rect x="360" y="560" width="270" height="145" class="store"/><circle cx="403" cy="606" r="22" class="iconFill"/><path d="M393 597h20v18h-20zM397 593h12M400 615v7M406 615v7" class="iconStroke"/><text x="440" y="604" class="cardTitle">FFmpeg + HLS</text><text x="383" y="649" class="cardText">MPEG-TS → rolling HLS files</text><text x="383" y="675" class="small">runtime/data/hls/ · stream copy</text><path d="M1120 435 C1120 505 970 505 970 632 H630" class="line2"/><text x="882" y="515" class="label">MPEG-TS over loopback TCP :5000</text><path d="M495 560 V435" class="line"/><text x="510" y="510" class="label">serve /stream</text>
  <rect x="1005" y="590" width="280" height="145" class="store"/><circle cx="1048" cy="636" r="22" class="iconFill"/><path d="M1040 635v-8a8 8 0 0 1 16 0v8M1036 635h24v18h-24zM1048 642v5" class="iconStroke"/><text x="1085" y="634" class="cardTitle">DPAPI private state</text><text x="1028" y="679" class="cardText">Encrypted Blink auth + camera selection</text><text x="1028" y="705" class="small">runtime/private/auth.dpapi</text><path d="M1140 435 V590" class="bi"/><text x="1155" y="520" class="label">load / save</text>
  <text x="80" y="858" class="small">Default adapter services stay on loopback. Dashboard LAN access is optional, token-gated, and plain HTTP unless a separate encrypted transport is validated.</text>
</svg>
